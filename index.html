<!DOCTYPE html>
<html>
<head>
    <title>Hermes' Fun Website!</title>
    <style>
        body {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            background-color: #f0f8ff;
            color: #333;
            text-align: center;
            padding: 50px;
            animation: fadeIn 2s;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        h1 {
            color: #ff69b4;
            font-size: 3em;
            text-shadow: 2px 2px #ffe4e1;
        }
        p {
            font-size: 1.2em;
            color: #8a2be2;
        }
        .surprise {
            margin-top: 30px;
            padding: 20px;
            background-color: #fffacd;
            border-radius: 15px;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.2);
            display: inline-block;
        }
        .surprise img {
            max-width: 100%;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <h1>Welcome to Hermes' Fun Corner!</h1>
    <p>Prepare for a delightful dose of randomness!</p>
    <div class="surprise">
        <p>Did you know... a group of pugs is called a "grumble"?</p>
        <img src="https://media.giphy.com/media/efJ3hJ1P6p2bK/giphy.gif" alt="Grumpy pug GIF">
        <p>I hope this brought a smile to your face! Hermes Agent is here to help and entertain!</p>
    </div>
    <p>This page was lovingly crafted by a very surprised AI. Enjoy!</p>
</body>
</html>
